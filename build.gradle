// build.gradle
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'jacoco'
}

group = 'com.fbrl'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// 웹, 검증, 모니터링
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
	testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
	testImplementation 'io.micrometer:micrometer-tracing-integration-test'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.7.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:7.7.0'

	// 데이터베이스 및 JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'

	implementation 'org.redisson:redisson:3.52.0'

	// kubernetes
	implementation 'io.kubernetes:client-java:27.0.0'
	implementation 'io.kubernetes:client-java-extended:27.0.0'

	// Kafka — Boot 4.0 모듈 분리로 인해 순수 spring-kafka가 아닌 starter를 써야
	// KafkaAutoConfiguration/KafkaProperties 자동설정 모듈까지 함께 들어온다.
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'

	implementation 'org.springframework.boot:spring-boot-starter-batch'
	testImplementation 'org.springframework.batch:spring-batch-test'

	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트 환경
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Lombok 테스트 환경
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 코드 포맷팅 설정
spotless {
	java {
		googleJavaFormat('1.19.2')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 테스트 커버리지 설정
jacoco {
	toolVersion = "0.8.11"
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
	environment "SPRING_JPA_HIBERNATE_DDL_AUTO", "update"
	environment "SPRING_SQL_INIT_MODE", "always"
}

tasks.named('bootRun') {
	environment "SPRING_JPA_HIBERNATE_DDL_AUTO", "update"
	environment "SPRING_SQL_INIT_MODE", "always"
}

jacocoTestReport {
	dependsOn tasks.test

	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
}